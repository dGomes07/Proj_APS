<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBudget - Orçamento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">EcoBudget</a>
        </div>
    </nav>
</header>

<main class="container my-5">

    <h1 class="mb-4">Simular Orçamento</h1>

    <form>

        <div class="mb-3">
            <label class="form-label">Nome</label>

            <input type="text" id="nome" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>

            <input type="email" id="email" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Data</label>

            <input type="date" id="data" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Área do terreno (m²)</label>

            <input type="number" id="area" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de serviço</label>

            <div>
                <input type="radio" name="servico" value="10">
                Básico
            </div>

            <div>
                <input type="radio" name="servico" value="20">
                Médio
            </div>

            <div>
                <input type="radio" name="servico" value="30">
                Avançado
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de Solo</label>

            <select class="form-select" id="solo">
                <option>Argiloso</option>
                <option>Arenoso</option>
                <option>Humoso</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Extras</label>

            <div>
                <input type="checkbox" id="irrig">
                Irrigação Sustentável (+200)
            </div>

            <div>
                <input type="checkbox" id="soloCheck">
                Análise do Solo (+150)
            </div>
        </div>

        <button type="button" class="btn btn-success" onclick="calc_orc()">
            Calcular
        </button>

    </form>

    <section class="resultado mt-4">
        <div id="resultado"></div>
    </section>

</main>

<footer class="bg-success text-white text-center p-3">
    <p>© 2026 EcoBudget - Projeto Acadêmico</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
